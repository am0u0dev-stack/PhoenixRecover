# PhoenixRecover release pipeline: builds every bundle target and attaches
# the artifacts to a GitHub Release.
#
# Trigger: push a tag `v*` (e.g. v0.1.0). A draft release is created with:
#   Linux: .deb, .rpm, .AppImage   Windows: .msi, .exe (NSIS)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # PhotoRec (CGSecurity) is the recovery backend; the distro package
      # ships it and Tauri bundles it as a resource for the sidecar lookup.
      - name: Install PhotoRec backend
        run: |
          sudo apt-get update
          sudo apt-get install -y testdisk
          mkdir -p src-tauri/bin
          cp /usr/bin/photorec src-tauri/bin/photorec-x86_64-unknown-linux-gnu

      - name: Build bundles (deb, rpm, appimage)
        run: |
          npm ci
          npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phoenixrecover-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Bundle the official PhotoRec Windows binaries (CGSecurity, portable
      # zip) as the GUI's recovery backend. Checked into the tree at
      # sidecar-photorec/ so the runner needs no download step.
      - name: Stage PhotoRec sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/bin | Out-Null
          Copy-Item src-tauri/sidecar-photorec/photorec_win.exe src-tauri/bin/photorec-x86_64-pc-windows-msvc.exe
          Copy-Item src-tauri/sidecar-photorec/*.dll src-tauri/bin/
          (Get-Content src-tauri/tauri.conf.json) -replace '\[\]', '["bin/cygewf-2.dll","bin/cyggcc_s-1.dll","bin/cygwin1.dll","bin/cygz.dll","bin/cygncursesw-10.dll","bin/libwinpthread-1.dll"]' | Set-Content src-tauri/tauri.conf.json

      - name: Build bundles (msi, nsis)
        run: |
          npm ci
          npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phoenixrecover-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist-artifacts

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist-artifacts/**
