name: Bug report
description: Something in PhoenixRecover does not behave as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** attach personal files —
        a redacted log is far more useful.

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Source type
      options:
        - HDD
        - SSD
        - USB flash drive
        - SD card
        - Disk image
        - Folder
    validations:
      required: true

  - type: dropdown
    id: fs
    attributes:
      label: Filesystem / format
      options:
        - NTFS
        - FAT / exFAT
        - ext4
        - HFS+ / APFS
        - Other / unknown
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PhoenixRecover version
      placeholder: "0.3.9"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste the relevant portion of `photorec.log`.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I did not include any personal or sensitive files.
          required: true
