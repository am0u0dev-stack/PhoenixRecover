name: Feature request
description: Suggest a new capability for PhoenixRecover
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you are in, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered

  - type: dropdown
    id: scope
    attributes:
      label: Which area does this affect?
      options:
        - Recovery engine
        - Filesystem parsing
        - File signatures / formats
        - User interface
        - Packaging / installers
        - Documentation
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The proposal preserves the read-only guarantee.
          required: true
