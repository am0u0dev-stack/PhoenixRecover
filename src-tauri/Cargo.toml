[package]
name = "phoenixrecover"
version = "0.2.3"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
unearth = "0.4.0"
forsmost = "0.1.1"
tempfile = "3"
chrono = "0.4"

[dev-dependencies]
rand = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

# Vendored: Source::open() could not size Windows volume handles (\\.\F:)
# because they reject FILE_END seeks; the vendor patch asks the device via
# IOCTL_DISK_GET_LENGTH_INFO instead.
[patch.crates-io]
unearth = { path = "vendor/unearth" }
